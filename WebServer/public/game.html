<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Game</title>
    <link rel="stylesheet" href="/css/game.css">
</head>
<body>
    <div class="container">
        <h1>Sign Language Game</h1>

        <div id="auth-section" class="section">
            <h2>Authentication</h2>
            <h3>Register</h3>
            <input type="text" id="register-username" placeholder="Username">
            <input type="email" id="register-email" placeholder="Email">
            <input type="password" id="register-password" placeholder="Password">
            <button id="register-btn">Register</button>

            <h3>Login</h3>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button id="login-btn">Login</button>
            <p id="auth-message" style="color: red;"></p>
        </div>

        <div id="game-controls" class="section hidden">
            <h2>Game Controls</h2>
            <p>Welcome, <span id="welcome-username"></span>!</p>
            <button id="fetch-progress-btn">Fetch My Progress</button>
            <button id="fetch-challenge-btn">Fetch Current Challenge</button>
            <button id="websocket-connect-btn">Connect WebSocket</button>
            <button id="websocket-disconnect-btn" class="hidden">Disconnect WebSocket</button>
            <button id="logout-btn" style="background-color: #dc3545;">Logout</button>
        </div>

        <div id="game-area" class="section hidden">
            <h2>Current Game State</h2>
            <p>Level: <span id="current-level">N/A</span> | Zone: <span id="current-zone">N/A</span> | Score: <span id="current-score">N/A</span></p>
            <p>Monster: <span id="monster-name">N/A</span></p>
            <p>Required Gesture: <span id="required-gesture">N/A</span></p>

            <div id="gesture-input-section">
                <h3>Simulate Hand Gesture (Type and Match)</h3>
                <input type="text" id="simulated-gesture-input" placeholder="Type gesture here (e.g., Hello)">
                <button id="send-gesture-btn">Send Gesture to Server (via HTTP API)</button>
                <button id="send-gesture-ws-btn">Send Gesture to Server (via WebSocket)</button>
            </div>

            <p id="game-message"></p>
        </div>

        <p id="message"></p>
    </div>

    <script src="/js/game.js"></script>
</body>
</html>
